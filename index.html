<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ea580c" />
    <meta
      name="description"
      content="Rebuild a timestamped GPX run from a planned route and your splits. Works offline; files never leave your device."
    />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>GPX Rebuilder</title>
    <script>
      // Apply the saved theme before first paint (see src/ui/lib/theme.ts).
      (function () {
        var t = 'system';
        try {
          t = localStorage.getItem('gpx-rebuilder:theme') || t;
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
